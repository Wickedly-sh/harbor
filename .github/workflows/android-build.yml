name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android (debug)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: pnpm tauri android init

      # Experimental: no libmpv is published for Android. Borrow the prebuilt
      # libmpv.so (+ its ffmpeg deps) from the mpv-android project's per-ABI
      # release APK until Harbor has its own Android player backend.
      - name: Fetch prebuilt libmpv (Android arm64-v8a)
        run: |
          set -euo pipefail
          MPV_ANDROID_TAG="2026-08-11"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/mpv-android/mpv-android/releases/download/${MPV_ANDROID_TAG}/app-default-arm64-v8a-release.apk" \
            -o mpv-android.apk
          JNILIBS="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNILIBS"
          unzip -o mpv-android.apk "lib/arm64-v8a/*.so" -d mpv-android-extract
          cp mpv-android-extract/lib/arm64-v8a/libmpv.so "$JNILIBS/"
          cp mpv-android-extract/lib/arm64-v8a/libavcodec.so "$JNILIBS/"
          cp mpv-android-extract/lib/arm64-v8a/libavdevice.so "$JNILIBS/"
          cp mpv-android-extract/lib/arm64-v8a/libavfilter.so "$JNILIBS/"
          cp mpv-android-extract/lib/arm64-v8a/libavformat.so "$JNILIBS/"
          cp mpv-android-extract/lib/arm64-v8a/libavutil.so "$JNILIBS/"
          cp mpv-android-extract/lib/arm64-v8a/libswresample.so "$JNILIBS/"
          cp mpv-android-extract/lib/arm64-v8a/libswscale.so "$JNILIBS/"
          cp mpv-android-extract/lib/arm64-v8a/libc++_shared.so "$JNILIBS/"
          rm -rf mpv-android.apk mpv-android-extract
          echo "RUSTFLAGS=-L $(pwd)/$JNILIBS" >> "$GITHUB_ENV"

      # A persistent signing key so successive builds share one certificate
      # and can be installed as an update (adb install -r) instead of
      # forcing an uninstall/reinstall every time.
      - name: Restore Android signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/harbor-android.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=$RUNNER_TEMP/keystore/harbor-android.keystore
          EOF

      - name: Tauri android build (release, unsigned APK skipped)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: pnpm tauri android build --target aarch64

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harbor-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: warn
